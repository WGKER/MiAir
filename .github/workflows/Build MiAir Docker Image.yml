name: Build MiAir Docker Image

on:
  push:
    branches:
      - docker
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
      - '*.png'
      - '*.sh'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository_owner }}/miair

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 support)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # 只构建 ARM64 镜像，可本地导出
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64  # 只构建 ARM64
          push: false
          outputs: type=docker,dest=/tmp/miair-image-arm64.tar
          tags: |
            ${{ env.IMAGE_NAME }}:latest-arm64
            ${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      # 上传 ARM64 镜像供下载
      - name: Upload ARM64 Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: miair-docker-image-arm64
          path: /tmp/miair-image-arm64.tar
          retention-days: 30
