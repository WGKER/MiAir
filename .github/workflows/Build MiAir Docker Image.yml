name: Build MiAir Docker Image

on:
  push:
    branches:
      - docker
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
      - '*.png'
      - '*.sh'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/miair

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 移除 packages: write 权限（无需上传镜像）

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # 移除 Docker 登录步骤（无需上传）

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false  # 关闭上传，只本地构建
          # 导出构建好的镜像到本地文件
          outputs: type=docker,dest=/tmp/miair-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      # 上传构建好的镜像文件，供你下载
      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: miair-docker-image
          path: /tmp/miair-image.tar
          retention-days: 30  # 保留30天，可自行修改
